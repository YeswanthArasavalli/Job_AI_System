[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sreejita-hiring-engine"
version = "6.0.0"
description = "Sreejita Hiring Engine - trustworthy AI resume intelligence, hiring simulation and career decision support (local-first, Ollama-powered)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sreejita Hiring Engine contributors" }]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "ollama>=0.3.0",
  "rich>=13.0",
  "fpdf2>=2.7.0",
  "playwright>=1.40.0",
  "streamlit>=1.30.0",
  "pdfplumber>=0.10.0",
  "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
sreejita = "main:cli_entry"

[tool.setuptools]
py-modules = ["main", "manual_mode", "app", "dashboard"]
[tool.setuptools.packages.find]
include = ["pipeline", "ats_scoring", "resume_engine", "resume_parser", "jd_processor", "database", "learning", "insights", "export", "utils", "pdf_generator", "scraper"]